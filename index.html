<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKAI SAGAMI ガクチカ作成支援</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
        .bg-soft { background-color: #F8FAFC; }
        /* Tokai Sagami Blue Accent */
        .text-tokai { color: #004098; }
        .bg-tokai { background-color: #004098; }
        .border-tokai { border-color: #004098; }
        .animate-pulse-soft { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
        /* Vertical Stripe Pattern (Subtle) */
        .bg-stripes {
            background-image: linear-gradient(90deg, rgba(0, 64, 152, 0.03) 50%, transparent 50%);
            background-size: 20px 100%;
        }
    </style>
</head>
<body class="bg-soft text-gray-800 min-h-screen p-4 md:p-8 bg-stripes">

    <!-- Header -->
    <header class="max-w-5xl mx-auto text-center mb-8">
        <h1 class="text-2xl md:text-3xl font-bold text-tokai flex flex-col items-center justify-center gap-2">
            <div class="flex items-center gap-3">
                <i class="fas fa-star text-yellow-400 animate-pulse-soft"></i>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-[#004098] to-[#3B82F6]">
                    TOKAI SAGAMI ガクチカ作成支援
                </span>
                <i class="fas fa-star text-yellow-400 animate-pulse-soft"></i>
            </div>
            <span class="text-sm md:text-base font-medium text-gray-500 tracking-wider">紡ごう！あなただけの東海相模ストーリー</span>
        </h1>
        <div class="flex justify-center gap-4 mt-6" id="stepper">
            <div id="step-dot-1" class="w-10 h-10 rounded-full flex items-center justify-center font-bold bg-[#004098] text-white shadow-lg scale-110 ring-4 ring-blue-50">1</div>
            <div id="step-dot-2" class="w-10 h-10 rounded-full flex items-center justify-center font-bold bg-gray-200 text-gray-500 transition-all">2</div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto">
        <!-- Step 1: Input Form -->
        <div id="view-step-1" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <div class="bg-blue-50 p-5 border-b border-blue-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-tokai flex items-center gap-2">
                    <i class="fas fa-pen-fancy"></i> STEP 1: 経験の整理
                </h2>
                <span class="hidden md:inline text-xs bg-white/80 px-4 py-1.5 rounded-full text-tokai font-bold shadow-sm">思いつくだけ沢山書こう</span>
            </div>
            
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-gradient-to-b from-white to-[#F8FAFC]">
                <!-- Cards -->
                <div class="bg-[#F0F7FF] p-5 rounded-2xl border border-blue-100 transition-transform hover:scale-[1.02]">
                    <label class="block text-tokai font-bold mb-1 flex items-center gap-2 text-sm italic"><i class="fas fa-smile"></i> 自分の人柄</label>
                    <textarea id="personality" class="w-full h-28 p-3 rounded-xl border border-blue-200 focus:ring-4 focus:ring-blue-50 focus:border-tokai outline-none text-sm" placeholder="例：粘り強い、チームの輪を大切にする、行動派など"></textarea>
                </div>
                <div class="bg-[#FDFCF0] p-5 rounded-2xl border border-yellow-100 transition-transform hover:scale-[1.02]">
                    <label class="block text-yellow-800 font-bold mb-1 flex items-center gap-2 text-sm italic"><i class="fas fa-quote-left"></i> 大切な言葉</label>
                    <textarea id="motto" class="w-full h-28 p-3 rounded-xl border border-yellow-200 focus:ring-4 focus:ring-yellow-50 focus:border-yellow-400 outline-none text-sm" placeholder="例：『一期一会』『全力投球』など"></textarea>
                </div>
                <div class="bg-[#FFF0F0] p-5 rounded-2xl border border-red-100 transition-transform hover:scale-[1.02]">
                    <label class="block text-red-800 font-bold mb-1 flex items-center gap-2 text-sm italic"><i class="fas fa-heart"></i> 楽しい・好き</label>
                    <textarea id="enjoyment" class="w-full h-28 p-3 rounded-xl border border-red-200 focus:ring-4 focus:ring-red-50 focus:border-red-400 outline-none text-sm" placeholder="例：部活動、文化祭、海外研修、地域貢献など"></textarea>
                </div>
                <div class="bg-[#F0FFF4] p-5 rounded-2xl border border-green-100 transition-transform hover:scale-[1.02]">
                    <label class="block text-green-800 font-bold mb-1 flex items-center gap-2 text-sm italic"><i class="fas fa-bullseye"></i> やりがい・目標</label>
                    <textarea id="goals" class="w-full h-28 p-3 rounded-xl border border-green-200 focus:ring-4 focus:ring-green-50 focus:border-green-400 outline-none text-sm" placeholder="例：日本一を目指す、苦手を克服するなど"></textarea>
                </div>
                <div class="bg-[#F5F3FF] p-5 rounded-2xl border border-purple-100 transition-transform hover:scale-[1.02]">
                    <label class="block text-purple-800 font-bold mb-1 flex items-center gap-2 text-sm italic"><i class="fas fa-exclamation-circle"></i> 苦労・悩み</label>
                    <textarea id="challenges" class="w-full h-28 p-3 rounded-xl border border-purple-200 focus:ring-4 focus:ring-purple-50 focus:border-purple-400 outline-none text-sm" placeholder="例：怪我での挫折、人間関係の悩みなど"></textarea>
                </div>
                <div class="bg-gray-50 p-5 rounded-2xl border border-gray-200 transition-transform hover:scale-[1.02]">
                    <label class="block text-gray-700 font-bold mb-1 flex items-center gap-2 text-sm italic"><i class="fas fa-user-slash"></i> 苦手・面倒</label>
                    <textarea id="dislikes" class="w-full h-28 p-3 rounded-xl border border-gray-300 focus:ring-4 focus:ring-gray-100 focus:border-gray-400 outline-none text-sm" placeholder="例：細かな事務作業、人前での緊張など"></textarea>
                </div>
            </div>

            <div class="p-8 bg-gray-50 flex flex-col items-center gap-4">
                <button id="generate-btn" class="flex items-center gap-3 px-12 py-4 rounded-2xl font-bold transition-all shadow-xl hover:shadow-2xl active:scale-95 bg-gradient-to-r from-[#004098] to-[#3B82F6] text-white">
                    ストーリーを生成する
                    <i class="fas fa-wand-magic-sparkles"></i>
                </button>
                <p id="error-message" class="text-red-500 text-sm font-medium hidden"></p>
            </div>
        </div>

        <!-- Step 2: Result -->
        <div id="view-step-2" class="hidden space-y-6">
            <div class="bg-white rounded-3xl shadow-2xl border border-gray-200 p-8">
                <div class="flex justify-between items-center mb-8 border-b border-dashed pb-6">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-sparkles text-yellow-400"></i>
                        <h2 class="text-2xl font-bold text-tokai">TOKAI SAGAMI STORY</h2>
                    </div>
                    <button id="back-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-1 transition-all">
                        <i class="fas fa-chevron-left"></i> 書き直す
                    </button>
                </div>

                <div id="story-container" class="space-y-6">
                    <!-- Results will be injected here -->
                </div>

                <div class="mt-12 pt-8 border-t flex flex-col items-center gap-5">
                    <button id="copy-all-btn" class="flex items-center gap-3 bg-gradient-to-r from-[#004098] to-[#3B82F6] text-white px-12 py-5 rounded-2xl font-bold hover:shadow-2xl transition-all transform hover:scale-105 active:scale-95 shadow-xl">
                        <i class="fas fa-copy"></i> 全文をまとめてコピー
                    </button>
                </div>
            </div>
            <p class="text-center text-xs text-gray-400 bg-white/40 backdrop-blur-sm py-3 rounded-2xl border border-white/50">
                ※AIが作成した下書きです。東海相模での日々を思い出しながら、自分の言葉に磨き上げよう！
            </p>
        </div>
    </main>

    <footer class="mt-12 mb-6 text-center">
        <div class="inline-flex items-center gap-4 px-6 py-2 rounded-full bg-white/50 text-tokai text-[10px] font-bold tracking-widest uppercase border border-blue-50">
            <span>TOKAI SAGAMI HIGH SCHOOL</span>
            <div class="w-1 h-1 bg-tokai rounded-full opacity-40"></div>
            <span>Career Design Support</span>
        </div>
    </footer>

    <script>
        const API_KEY = ""; // Provided by environment

        const views = {
            step1: document.getElementById('view-step-1'),
            step2: document.getElementById('view-step-2')
        };
        const dots = {
            1: document.getElementById('step-dot-1'),
            2: document.getElementById('step-dot-2')
        };

        let generatedStory = null;

        document.getElementById('generate-btn').addEventListener('click', generateStory);
        document.getElementById('back-btn').addEventListener('click', () => switchView(1));
        document.getElementById('copy-all-btn').addEventListener('click', copyAll);

        function switchView(step) {
            if (step === 1) {
                views.step1.classList.remove('hidden');
                views.step2.classList.add('hidden');
                dots[1].className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-[#004098] text-white shadow-lg scale-110 ring-4 ring-blue-50";
                dots[2].className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-gray-200 text-gray-500 transition-all";
            } else {
                views.step1.classList.add('hidden');
                views.step2.classList.remove('hidden');
                dots[2].className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-[#004098] text-white shadow-lg scale-110 ring-4 ring-blue-50";
                dots[1].className = "w-10 h-10 rounded-full flex items-center justify-center font-bold bg-gray-200 text-gray-500 transition-all";
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function generateStory() {
            const btn = document.getElementById('generate-btn');
            const errEl = document.getElementById('error-message');
            
            const data = {
                personality: document.getElementById('personality').value,
                motto: document.getElementById('motto').value,
                enjoyment: document.getElementById('enjoyment').value,
                goals: document.getElementById('goals').value,
                challenges: document.getElementById('challenges').value,
                dislikes: document.getElementById('dislikes').value
            };

            if (!data.personality || !data.enjoyment) {
                errEl.innerText = "「人柄」と「楽しいこと（部活や行事など）」は必ず入力してください！";
                errEl.classList.remove('hidden');
                return;
            }

            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 東海相模の物語を生成中...`;

            const prompt = `あなたは進路指導のアドバイザーです。TOKAI SAGAMI HIGH SCHOOL（東海大学付属相模高等学校）の高校2年生が、自分の経験を元にガクチカ（学生時代に力を入れたこと）を作成するのを手伝ってください。以下の入力情報を元に、ポジティブで熱意のある文章を生成し、JSON形式で返してください。

重要事項：
- ①「結論」は現在進行形（決意表明）にしてください。例：「私は〜に全力で取り組んでいます」「〜を目標に活動しています」など。
- 生徒は現在高校2年生であり、これからさらに飛躍しようとしているトーンを意識してください。

入力：
- 人柄: ${data.personality}
- 大切な言葉: ${data.motto}
- 楽しい/好き（活動）: ${data.enjoyment}
- 目標: ${data.goals}
- 苦労: ${data.challenges}
- 苦手: ${data.dislikes}

形式：
{
  "conclusion": "結論：今、何に全力で取り組んでいるか（現在形・決意表明）",
  "motivation": "動機：なぜ始めたか、東海相模の精神やモットーとの関連",
  "goals_and_challenges": "目標と壁：何を目指し、どんな困難に立ち向かっているか",
  "action_and_result": "行動と途中経過：具体的にどう動き、どんな変化が生まれているか",
  "personality": "人柄：自分の強みがどう活きているか",
  "learning_exp": "学び：これまでの経験を通じて得た気づき",
  "university_study": {
    "text": "このことから、大学では〇〇や〇〇といった学問を学んでみたいと思います。",
    "academic_fields": ["領域名1", "領域名2"],
    "departments": ["#学科1", "#学科2", "#学科3"]
  }
}

※ "academic_fields" は以下の10領域から最も関連が高いものを2つ選んでください：
人文科学、社会科学、理学、工学、農学、医療・保健、教育、生活科学、芸術、総合科学

※ "university_study" の "text" 内の 〇〇 は、"academic_fields" で選んだ具体的な学問名を入れてください。
※ "departments" は、選んだ領域に含まれる具体的な学部学科名をなるべくたくさん（5〜8個程度）ハッシュタグ形式でリストアップしてください。`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                generatedStory = JSON.parse(result.candidates[0].content.parts[0].text);
                
                renderStory(generatedStory);
                switchView(2);
            } catch (err) {
                errEl.innerText = "生成に失敗しました。接続を確認してください。";
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `ストーリーを生成する <i class="fas fa-wand-magic-sparkles"></i>`;
            }
        }

        function renderStory(story) {
            const container = document.getElementById('story-container');
            
            const sections = [
                { title: "① 結論（決意）", content: story.conclusion, color: "bg-blue-50 border-blue-100 text-blue-900" },
                { title: "② 動機", content: story.motivation, color: "bg-indigo-50 border-indigo-100 text-indigo-900" },
                { title: "③ 目標と困難", content: story.goals_and_challenges, color: "bg-orange-50 border-orange-100 text-orange-900" },
                { title: "④ 取り組みと経過", content: story.action_and_result, color: "bg-cyan-50 border-cyan-100 text-cyan-900" },
                { title: "⑤ 人柄", content: story.personality, color: "bg-slate-50 border-slate-200 text-slate-900" },
                { title: "⑥ 学び", content: story.learning_exp, color: "bg-yellow-50 border-yellow-100 text-yellow-900" }
            ];

            let html = sections.map(s => `
                <div class="p-6 rounded-2xl border ${s.color} relative group shadow-sm transition-all hover:shadow-md">
                    <h3 class="font-bold text-[10px] uppercase tracking-widest mb-2 opacity-50 flex items-center gap-1">
                        <div class="w-1 h-3 bg-current rounded-full"></div>
                        ${s.title}
                    </h3>
                    <p class="leading-relaxed whitespace-pre-wrap text-[15px] font-medium">${s.content}</p>
                    <button onclick="copyText(\`${s.content.replace(/`/g, '\\`').replace(/\n/g, '\\n')}\`)" class="absolute top-4 right-4 p-2 rounded-xl bg-white/80 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-white shadow-sm">
                        <i class="fas fa-clipboard text-xs"></i>
                    </button>
                </div>
            `).join('');

            if (story.university_study) {
                const hashtags = story.university_study.departments.map(d => 
                    `<span class="inline-block bg-white/60 px-3 py-1 rounded-full text-[13px] font-bold text-emerald-700 border border-emerald-100">${d}</span>`
                ).join(' ');

                html += `
                <div class="p-6 rounded-2xl border bg-emerald-50 border-emerald-100 text-emerald-900 relative group shadow-sm transition-all hover:shadow-md">
                    <h3 class="font-bold text-[10px] uppercase tracking-widest mb-2 opacity-50 flex items-center gap-1 text-emerald-800">
                        <div class="w-1 h-3 bg-emerald-600 rounded-full"></div>
                        ⑦ 大学での学び
                    </h3>
                    <p class="leading-relaxed whitespace-pre-wrap text-[15px] font-bold mb-4">${story.university_study.text}</p>
                    <div class="flex flex-wrap gap-2">
                        ${hashtags}
                    </div>
                    <button onclick="copyText(\`${(story.university_study.text + '\\n' + story.university_study.departments.join(' ')).replace(/`/g, '\\`').replace(/\n/g, '\\n')}\`)" class="absolute top-4 right-4 p-2 rounded-xl bg-white/80 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-white shadow-sm">
                        <i class="fas fa-clipboard text-xs text-emerald-600"></i>
                    </button>
                </div>
                `;
            }

            container.innerHTML = html;
        }

        function copyText(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }

        function copyAll() {
            if (!generatedStory) return;
            const basic = Object.entries(generatedStory).filter(([k]) => k !== 'university_study').map(([k, v]) => `【${k}】\n${v}`).join('\n\n');
            const study = `\n\n【大学での学び】\n${generatedStory.university_study.text}\n${generatedStory.university_study.departments.join(' ')}`;
            copyText(basic + study);
        }
    </script>
</body>
</html>
